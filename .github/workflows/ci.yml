# Release gate for LibretroWebXR.
#
# WHAT THIS GATES, AND WHY ONLY THIS
# ----------------------------------
# `npm test` is a long `&&` chain of 35 `scripts/test-*.mjs` runners plus three
# `node --test` files (`npm run test:node`). Every one of them was checked
# before this workflow was written: none of them import `ws`, `node:net`,
# `node:http`, `node:dgram`, `node:child_process` or `puppeteer-core`, none of
# them bind a port, and none of them need a browser. They are pure logic, so
# they run on a clean hosted runner with nothing else started.
#
# The whole chain was executed against a tracked-files-only tree (produced with
# `git archive HEAD`, i.e. exactly what a fresh clone gets) and passed
# 209 script assertions + 26 node:test cases, exit 0, in ~10s.
#
# DELIBERATELY NOT IN CI (they cannot pass on a clean hosted runner):
#   * `scripts/probe-*.mjs|js` and `scripts/smoke-*.mjs` — these drive real
#     Chrome via `puppeteer-core` (system browser, see DEBUGGING.md) and/or need
#     the room-server on :8787 and the log-server on :8788. `npm run debug`
#     defaults to the PRODUCTION deploy, not localhost.
#   * anything touching `public/cores/` — the libretro cores are gitignored and
#     fetched by `npm run fetch-cores`; a clean checkout has none, so every
#     emulator probe would fail on a missing `.wasm`.
#   * anything touching `public/roms/local/` — the user's own ROM library, never
#     committed.
#   * `npm audit` — the reviews (CODEX_REVIEW.md TST-4) note a registry-
#     unreachable run must be treated as "unknown", not "clean"; a gate that can
#     go green on a network error is worse than no gate. Left for a separate,
#     explicitly-scheduled workflow.
# Adding a vacuously-green browser tier here would be worse than omitting it.
# See CODEX_REVIEW.md TST-1 for the full tiered plan this is tier 1+2 of.
#
# MAINTENANCE RULE: the `app` job runs `npm test`, so anything appended to that
# chain in package.json lands here automatically. Whatever you add must (a) need
# no browser, (b) need no core under public/cores/ and no ROM under
# public/roms/local/ — both are gitignored and absent on a runner, and (c) bind
# only ephemeral loopback ports it starts and stops itself, never the fixed dev
# ports 5173/8787/8788. If a check cannot honour all three, give it its own
# npm script and its own workflow tier instead of bolting it onto `npm test`.
#
# That rule is why the three socket-level suites (test-net-signal, test-log-server,
# test-room-limits) are NOT in `npm test`: they spawn servers and bind fixed
# ports. They run in the `server` job below as `npm run test:servers` — tier 3.
#
# NODE VERSION: pinned to the exact interpreter this repo is developed and
# verified on (`node -v` -> v24.7.0). package.json declares
# `engines.node >= 22.12.0`, the true transitive floor from the lockfile
# (vite 7 wants ^20.19 || >=22.12, puppeteer-core >=22.12). The engines field is
# the SUPPORTED range; NODE_VERSION here is the single version the gate actually
# proves. Bump them together, and keep NODE_VERSION inside the engines range.

name: CI

on:
  push:
  pull_request:

# One in-flight run per ref; a new push supersedes the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.7.0"

jobs:
  app:
    name: app — npm ci / npm test / npm run build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # `npm ci` (not `npm install`) so the tracked lockfile is authoritative
      # and a drifted lockfile fails the build instead of being rewritten.
      - name: Install locked dependencies
        run: npm ci

      - name: Run the pure-logic test suite
        run: npm test

      # A production build is not part of `npm test`; TST-1 calls this out
      # explicitly. It also catches broken imports the runners never load.
      - name: Build for production
        run: npm run build

      - name: Upload the production build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  server:
    name: server — locked install + syntax gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up the pinned Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      # server/ has its OWN package.json + lockfile (TST-4). Install it from the
      # lockfile so server dependency drift is caught here rather than on deploy,
      # where scripts/deploy.ps1 uses a plain `npm install`.
      - name: Install locked server dependencies
        run: npm ci
        working-directory: server

      - name: Parse-check the server modules
        run: node --check server/room-server.mjs && node --check server/log-server.mjs && node --check server/Hub.js && node --check server/smoke.mjs

      # `npm run test:servers` needs the ROOT devDependencies too (`ws`), not
      # just server/. Separate lockfile, separate install.
      - name: Install locked root dependencies
        run: npm ci

      # TIER 3 — real sockets. These spawn the room-server and log-server as
      # child processes and drive them over ws/http, so they cannot live in the
      # `npm test` chain (see the MAINTENANCE RULE above: that tier binds no
      # ports). They bind 8891-8897 on loopback, which are free on a hosted
      # runner, and each stops what it started.
      #
      # What they gate: the log server's XSS escaping and its one-request crash,
      # the relay's admission limits and memory budget, and the SIGNAL 'bye'
      # round trip that video teardown depends on. Each suite carries a negative
      # control that boots the PRE-FIX module and shows the assertions inverting,
      # so a green run here means the fix, not the harness.
      - name: Run the socket-level server suites
        run: npm run test:servers
